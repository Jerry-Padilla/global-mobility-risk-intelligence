name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mobility
          POSTGRES_USER: mobility
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mobility"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_DEBUG: 'true'
      SECRET_KEY: ci-test-key-only
      POSTGRES_PASSWORD: test-only
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.lock
      - run: npm ci && npm run build
      - run: python manage.py collectstatic --noinput
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python -m pytest --cov=apps --cov-report=term-missing
      - run: python manage.py migrate && python manage.py generate_company_data && python manage.py publish_analytics
      - run: python -m playwright install --with-deps chromium
      - run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/meridian.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/ && break || sleep 1; done
          python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: docs/screenshots
