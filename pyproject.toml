[project]
name = "mobility-risk-intelligence"
version = "0.1.0"
description = "Explainable manufacturing and vehicle safety intelligence"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework", "psycopg[binary]",
  "django-filter", "drf-spectacular", "whitenoise", "httpx",
  "duckdb", "pyarrow", "polars", "python-dotenv",
  "gunicorn; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "pytest-cov", "factory-boy", "ruff", "playwright", "djlint"]
snowflake = ["snowflake-connector-python"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["browser: requires running application and Chromium", "snowflake: requires warehouse credentials"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".runtime", "static", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
